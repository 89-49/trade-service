spring:
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  profiles:
    active: test
    include: error, trade-error

  kafka:
    consumer:
      group-id: trade-service-test
    listener:
      ack-mode: record

topics:
  reservation:
    completed: test-reservation-completed
  trade:
    created: test-trade-created
    completed: test-trade-completed
